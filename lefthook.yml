# Validate commit messages
commit-msg:
  jobs:
    - name: commitlint
      run: npx --no -- commitlint --edit {1}

# Validate content before committing (staged files only, kept fast)
pre-commit:
  jobs:
    - name: ultracite
      run: npx ultracite fix --type-aware --type-check {staged_files}
      glob:
        - '**/*.js'
        - '**/*.jsx'
        - '**/*.ts'
        - '**/*.tsx'
        - '**/*.json'
        - '**/*.jsonc'
        - '**/*.css'
      stage_fixed: true
    - name: secretlint
      run: npx secretlint {staged_files}
      glob:
        - '**/*'

# Heavier checks before pushing; CI re-runs everything as the final gate
pre-push:
  jobs:
    - name: check:types
      run: bun run check:types
    - name: test
      run: bun run test
